name: GitHub Pages

on:
  push:
    branches: [motor_modes_pwa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/motor_modes_pwa'
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Publish bundle to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          npm run deploy -- --user 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
